# routing.yaml: owned by the repository, read by the harness plugin.
# Its SHA-256 is config_sha256 on every metadata line (C16): don't edit it during a baseline.
version: 1
mode: observe            # off | observe | route   (observe = the baseline: scored, not routed)

tiers:                   # thresholds and overrides come from the complexity-rubric skill
  T1: { max_score: 2,  agent: impl-t1, model: sonnet, effort: low }
  T2: { max_score: 6,  agent: impl-t2, model: sonnet, effort: medium }
  T3: { max_score: 9,  agent: impl-t3, model: sonnet, effort: high }
  T4: { max_score: 12, agent: impl-t4, model: opus,   effort: medium }

eval:                    # harness-eval runs these in order against what is staged; the first failure stops it
  stages: []             # e.g. - { name: build, run: "npm run build", cwd: web, env: { CI: "1" }, timeout_minutes: 15 }

gate:
  marker_ttl_minutes: 30 # how long a pass allows a commit of the diff it was for

metadata:
  dir: .harness          # gitignored
  retention_days: 30
  include_justifications: true
